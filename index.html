<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Mapbox</title>

  <!-- MAPBOX CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />

  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
  }

  body {
    background: #0f172a;
  }

  #map {
    width: 100%;
    height: 100vh;
  }

  .bottom-bar {
    position: fixed;
    bottom: 0;
    height: 12.5%;
    width: 100%;
    backdrop-filter: blur(15px);
    background: black;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: start;
    border-top: 1px solid rgb(255,255,255);
  }

  .info-block {
    display: flex;
    flex-direction: column;
  }

  .label {
    font-size: 12px;
    color: white;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .value {
    font-size: 16px;
    font-weight: 600;
    color: white;
  }

  .time {
    text-align: right;
  }

  .time .value {
    color: white;
  }

</style>
</head>

<body>

<div id="map"></div>

<div class="bottom-bar">
  <div class="info-block">
    <div class="label">Latitud</div>
    <div class="value" id="latitud"></div>
  </div>

  <div class="info-block">
    <div class="label">Longitud</div>
    <div class="value" id="longitud"></div>
  </div>

  <div class="info-block time">
    <div class="label">Última actualización</div>
    <div class="value" id="hora"></div>
  </div>
</div>


<!-- scrip de mapbox -->
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAyszZqHJVRLjyQT6eNcArnfNQE9Hkq93I",
  authDomain: "mapboxsaul.firebaseapp.com",
  databaseURL: "https://mapboxsaul-default-rtdb.firebaseio.com",
  projectId: "mapboxsaul",
  storageBucket: "mapboxsaul.firebasestorage.app",
  messagingSenderId: "1028928690935",
  appId: "1:1028928690935:web:7819894606e1f7c0d491f2",
  measurementId: "G-ZT2ZMG74YM"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

/* mapbox tocken */

mapboxgl.accessToken = "pk.eyJ1Ijoic2F1bHNhbmNob24iLCJhIjoiY21tOXhueDVkMDJtZzJ3cHJscmt0bTB5OSJ9.rlCojaq0KHdhbDjbJbUQzQ";

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/streets-v12',
  center: [-68.15, -16.5],
  zoom: 15
});

const marker = new mapboxgl.Marker()
  .setLngLat([-68.15, -16.5])
  .addTo(map);

/* info de lat log hora */

const latDiv = document.getElementById('latitud');
const lngDiv = document.getElementById('longitud');
const horaDiv = document.getElementById('hora');

/* firebase */

const locationRef = ref(database, "ubicacion");

onValue(locationRef, (snapshot) => {
  const data = snapshot.val();

  if (data && data.latitud && data.longitud && data.timestamp) {

    const nuevaPosicion = [data.longitud, data.latitud];

    marker.setLngLat(nuevaPosicion);

    map.flyTo({
      center: nuevaPosicion,
      speed: 1.5
    });

    latDiv.textContent = `Latitud: ${data.latitud.toFixed(6)}`;
    lngDiv.textContent = `Longitud: ${data.longitud.toFixed(6)}`;

    const date = new Date(data.timestamp);
    horaDiv.textContent = `Hora: ${date.toLocaleString('es-BO')}`;
  }
});

</script>

</body>
</html>
